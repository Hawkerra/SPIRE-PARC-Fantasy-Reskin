name: Build SPIRE Local (Android)

# Builds the standalone "SPIRE Local" app (no Chub needed) as an Android APK.
# Pull requests get the APK as a downloadable artifact; pushes to main also publish it
# to the "local-latest" release for a direct download link.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.2.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          yarn install
          npm ci --prefix local

      - name: Build the standalone web app
        run: yarn build:local

      - name: Copy it into the Android project
        working-directory: local
        run: npx cap sync android

      - name: Build APK
        working-directory: local/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SPIRE-Local.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: SPIRE-Local-apk
          path: SPIRE-Local.apk
          if-no-files-found: error

      - name: Publish to the "local-latest" release (direct download link)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete local-latest --yes --cleanup-tag || true
          gh release create local-latest SPIRE-Local.apk \
            --title "SPIRE Local - latest build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download SPIRE-Local.apk below and open it to install or update; your saves are kept." \
            --target "$GITHUB_SHA" \
            --prerelease
